<!DOCTYPE html>
<html lang="ja">
<head>
  {% assign og_img = site.og_image | default: "/assets/ogp.png" %}

<meta property="og:type" content="website" />
<meta property="og:title" content="{{ page.og_title | default: page.title | default: site.title }}" />
<meta property="og:description" content="{{ page.og_description | default: page.description | default: site.description }}" />
<meta property="og:image" content="{{ og_img | absolute_url }}" />
<meta property="og:locale" content="ja_JP" />

  <!-- Home screen (use ogp.png) -->
<link rel="apple-touch-icon" href="{{ site.og_image | relative_url }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{ site.title }}">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
<meta name="theme-color" content="#ff6b6b">

  {% include head.html %}
</head>
<body class="hobby-theme">
  {% include nav.html %}

  <header class="header hobby-header">
    <h1>{{ page.title | default: site.title }}</h1>
    {% if page.header_lead %}
      <p>{{ page.header_lead | newline_to_br }}</p>
    {% endif %}
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="footer">© {{ site.time | date: "%Y" }}</footer>
</body>
</html>
